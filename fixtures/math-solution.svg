<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600">
  <rect width="1800" height="600" fill="#ffffff" />
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="78" fill="#111827">Problem: x^2 - 5x + 6 = 0</text>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="72" fill="#111827">Student: (x - 2)(x - 3) = 0</text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="72" fill="#111827">x = 2 or x = 3</text>
</svg>
